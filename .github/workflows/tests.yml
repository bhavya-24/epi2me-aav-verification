name: Verification harness tests
on: [push, pull_request]
jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s tests -v
      - name: Check batch script syntax
        run: |
          for script in hpc/eddie.qsub hpc/site-setup.sh scripts/prepare-runtime.sh scripts/samtools scripts/bcftools; do
            bash -n "$script"
          done
